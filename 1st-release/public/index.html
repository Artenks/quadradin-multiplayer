<html>
  <head>
    <meta charset="utf-8" />
    <title>Acabaxi</title>
    <h1>:)</h1>

    <style>
      body {
        margin: 40px 0 0 0;
        padding: 0;
        background-color: #eee;
        text-align: center;
        overflow: hidden;
      }
      .border {
        outline: none;
        border: 2px solid #4de08f;
        box-shadow: 0px 0px 8px #4de08f;
        -moz-box-shadow: 0px 0px 8px #4de08f;
        -webkit-box-shadow: 0px 0px 8px #4de08f;
      }

      #screen {
        border: 1px solid #ccc;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        image-rendering: -moz-crisp-edges;
        width: 500px;
        height: 500px;
        -webkit-box-shadow: 0px 4px 17px 0px rgba(0, 0, 0, 0.19);
        -moz-box-shadow: 0px 4px 17px 0px rgba(0, 0, 0, 0.19);
        box-shadow: 0px 4px 17px 0px rgba(0, 0, 0, 0.19);
        margin-bottom: 20px;
        margin-left: 20px;
        margin-right: 20px;
        display: inline-block;
        vertical-align: top;
        outline: none;
        border: 2px solid #4de08f;
        box-shadow: 0px 0px 8px #4de08f;
        -moz-box-shadow: 0px 0px 8px #4de08f;
        -webkit-box-shadow: 0px 0px 8px #4de08f;
      }
      #score-table {
        font-size: 13px;
        vertical-align: top;
        display: inline-block;
        font-family: Arial, Helvetica, sans-serif;
      }

      #score-table tr.header td {
        border-bottom: 1px solid #ccc;
        padding-bottom: 8px;
      }

      #score-table tr.footer td {
        border-top: 1px solid #ccc;
        font-size: 11px;
      }

      #score-table td {
        padding-top: 5px;
        padding-bottom: 5px;
      }

      #score-table .socket-id {
        font-weight: normal;
        color: #222;
        width: 150px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-block;
      }

      #score-table .score-value {
        color: #ccc;
        font-weight: bold;
        text-align: right;
      }

      #score-table .current-player {
        color: #4de08f;
      }
    </style>
    <script src="socket.io/socket.io.js"></script>
  </head>
  <body>
    <canvas id="screen" width="25" height="25" class="border"></canvas>
    <table id="score-table"></table>

    <script type="module">
      import createKeyboardListener from "./keyboard-listener.js";
      import createGame from "./game.js";
      import renderScreen from "./render-screen.js";

      const game = createGame();
      const keyboardListener = createKeyboardListener(document);

      const socket = io(); //retorna um event emitter

      function sound(src) {
        this.sound = document.createElement("audio");
        this.sound.src = src;
        this.sound.setAttribute("preload", "auto");
        this.sound.setAttribute("controls", "none");
        this.sound.style.display = "none";
        document.body.appendChild(this.sound);
        this.play = function () {
          this.sound.play();
        };
        this.stop = function () {
          this.sound.pause();
        };
      }

      const audios = {
        //playerCollision: new sound("./sounds/bubble_hit.mp3"),
        //newFruit: new sound("./sounds/fruit_drop.mp3"),
        //wallCollision: new sound("./sounds/wall_energy_shock.mp3"),
        //eatFruit: new sound("./sounds/eat_fruit_apple.mp3"),
        //drinkPot: new sound("./sounds/human_swallowing_loud.mp3"),
      };

      socket.on("connect", () => {
        const playerId = socket.id;

        const screen = document.getElementById("screen");
        const scoreTable = document.getElementById("score-table");

        renderScreen(screen, game, requestAnimationFrame, playerId, scoreTable);
      });

      socket.on("setup", (state) => {
        const playerId = socket.id;
        game.setState(state);

        keyboardListener.registerPlayerId(playerId);
        keyboardListener.subscribe(game.movePlayer);
        keyboardListener.subscribe((command) => {
          socket.emit("move-player", command);
        });
      });

      socket.on("add-player", (command) => {
        // console.log(`Receiving ${command.type} -> ${command.playerId}`)
        game.addPlayer(command);
      });

      socket.on("remove-player", (command) => {
        //console.log(`> Receiving ${command.type} > ${command.playerId}`);
        game.removePlayer(command);

        //console.log("Unsubscribing All");
        keyboardListener.unsubscribeAll();
      });

      socket.on("move-player", (command) => {
        //console.log(`> Receiving ${command.type} > ${command.playerId}`);

        const playerId = socket.id;

        if (playerId !== command.playerId) {
          game.movePlayer(command);
        }
      });

      socket.on("add-fruit", (command) => {
        //console.log(`> Receiving ${command.type} > ${command.fruitId}`);
        game.addFruit(command);
      });

      socket.on("remove-fruit", (command) => {
        //console.log(`> Receiving ${command.type} > ${command.fruitId}`);
        game.removeFruit(command);
      });

      socket.on("play-audio", (command) => {
        // console.log(`Receiving ${command.type} -> ${command.fruitId}`)
        const playerId = socket.id;
        if (command.audio && audios[command.audio]) {
          //only play sound for those users
          if (command.playersId && command.playersId.indexOf(playerId) > -1)
            audios[command.audio].sound.cloneNode(true).play();
        }
      });
    </script>
  </body>
</html>
