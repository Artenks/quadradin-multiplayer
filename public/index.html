<html>
  <head>
    <meta charset="utf-8" />
    <title>Acabaxi</title>

    <style>
      tr {
        color: #eee;
        text-align: center;
      }

      body {
        margin: 80px 0 0 0;
        padding: 0;
        background-color: rgb(17, 17, 17);
        text-align: center;
        overflow: hidden;
      }

      .container {
        position: relative;

        width: 100%;
        margin-right: auto;
        margin-left: auto;
        margin: 80px 0 0 0;
        font-family: impact, sans-serif;
        background-color: #eee;

        padding-bottom: 27rem;
        padding-top: 3rem;
      }

      #screen {
        position: relative;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        image-rendering: -moz-crisp-edges;
        width: 650;
        height: 600;
        -webkit-box-shadow: 0px 4px 17px 0px rgba(0, 0, 0, 019);
        -moz-box-shadow: 0px 4px 17px 0px rgba(0, 0, 0, 019);
        box-shadow: 0px 4px 17px 0px rgba(0, 0, 0, 019);
        margin-bottom: 20px;
        margin-left: 20px;
        margin-right: 20px;
        display: inline-block;
        vertical-align: left;
      }
      #score-table {
        margin-left: 20px;
        margin-right: 20px;
        font-size: 13px;
        vertical-align: top;
        display: inline-block;
      }

      #score-table tr.header td {
        border-bottom: 1px solid #eee;
        padding-bottom: 8px;
      }

      #score-table tr.footer td {
        border-top: 1px solid #eee;
        font-size: 11px;
      }

      #score-table td {
        padding-right: 15px;
        padding-left: 15px;
        margin-right: auto;
        margin-left: auto;
      }

      #score-table .socket-id {
        font-weight: normal;
        color: #222;
        width: 150px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-block;
      }

      #score-table .score-value {
        color: #ccc;
        font-weight: bold;
        text-align: right;
      }

      #score-table .current-player {
        color: #4de08f;
      }
      #max-concurrent-connection-message {
        border: 1px solid #000;
        background: #eee;
        text-align: center;
        margin: auto;
        margin: 100px;
        padding: 50px;
        font-family: Arial, Helvetica, sans-serif;
        display: none;
      }
    </style>
    <script src="socket.io/socket.io.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="screen" width="20" height="20"></canvas>
      <table id="score-table"></table>
    </div>

    <div id="max-concurrent-connection-message">
      <h1>Número máximo de conexões atingido :(</h1>
      <h2>(Não se preoucupe)</h2>
      <p>
        Mesmo estando no limite máximo, assim que liberar espaço, você será
        conectado no servidor automaticamente :)
      </p>
      <p>obrigado 💚</p>
    </div>

    <script type="module">
      import createKeyboardListener from "./keyboard-listener.js";
      import createGame from "./game.js";
      import renderScreen from "./render-screen.js";

      const game = createGame();
      const keyboardListener = createKeyboardListener(document);

      const socket = io();

      socket.on("connect", () => {
        const playerId = socket.id;

        const scoreTable = document.getElementById("score-table");
        const screen = document.getElementById("screen");
        renderScreen(screen, game, requestAnimationFrame, playerId, scoreTable);
      });

      socket.on("disconnect", () => {
        //console.log("Unsubscribing All");
        keyboardListener.unsubscribeAll();
      });

      socket.on("setup", (state) => {
        const playerId = socket.id;
        game.setState(state);

        keyboardListener.registerPlayerId(playerId);
        keyboardListener.subscribe(game.movePlayer);
        keyboardListener.subscribe((command) => {
          socket.emit("move-player", command);
        });
      });

      socket.on("add-player", (command) => {
        // console.log(`Receiving ${command.type} -> ${command.playerId}`)
        game.addPlayer(command);
      });

      socket.on("remove-player", (command) => {
        //console.log(`> Receiving ${command.type} > ${command.playerId}`);
        game.removePlayer(command);
      });

      socket.on("move-player", (command) => {
        //console.log(`> Receiving ${command.type} > ${command.playerId}`);

        const playerId = socket.id;

        if (playerId !== command.playerId) {
          game.movePlayer(command);
        }
      });

      socket.on("add-fruit", (command) => {
        //console.log(`> Receiving ${command.type} > ${command.fruitId}`);
        game.addFruit(command);
      });

      socket.on("remove-fruit", (command) => {
        //console.log(`> Receiving ${command.type} > ${command.fruitId}`);
        game.removeFruit(command);
      });

      socket.on("play-audio", (command) => {
        // console.log(`Receiving ${command.type} -> ${command.fruitId}`)
        const playerId = socket.id;
        if (command.audio && audios[command.audio]) {
          //only play sound for those users
          if (command.playersId && command.playersId.indexOf(playerId) > -1)
            audios[command.audio].sound.cloneNode(true).play();
        }
      });

      socket.on("show-max-concurrent-connections-message", () => {
        document.getElementById(
          "max-concurrent-connection-message"
        ).style.display = "block";
        document.getElementById("game-container").style.display = "none";
      });

      socket.on("hide-max-concurrent-connections-message", () => {
        document.getElementById(
          "max-concurrent-connection-message"
        ).style.display = "none";
        document.getElementById("game-container").style.display = "block";
      });
    </script>
    <div class="container">
      <h1>um teste feito com 💚 por artenks</h1>
    </div>
  </body>
</html>
